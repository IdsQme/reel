[package]
name = "reel"
version = "0.1.0"
edition = "2024"
description = "A Catppuccin Mocha streaming TUI for mpv with Stremio addon support"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "events", "windows"] }
dirs = "7"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "http2", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
